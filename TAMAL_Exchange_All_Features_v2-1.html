const TABLES=["orders","exchange_rates","admin_payment_accounts","notifications","identity_verifications","support_messages","customer_payment_methods","customer_profiles","profiles"];
async function admin(){if(!await needUser())return;if(!adminRole())return say("Ma lihid door maamul. Super Admin-ka waa inuu role-ka Supabase kuu qoondeeyo.","err");view.innerHTML=`<div class=panel><h1>Admin Dashboard</h1><p>Super Admin email: ${esc(CFG.superAdminEmail)}. Hubi in profile-ka email-kan lagu siiyey role=super_admin gudaha Supabase; email keliya ma siinayo awood maamul oo ammaan ah.</p><div class=notice">Backend-ka waa inuu leeyahay RLS sax ah iyo private storage buckets: order-proofs, identity-photos. Jadwallada looga baahan yahay: profiles, customer_profiles, customer_payment_methods, orders, exchange_rates, admin_payment_accounts, identity_verifications, support_messages, notifications.</div><div class=grid>${TABLES.map(t=>`<button class=secondary onclick="adminTable('${t}')">${t}</button>`).join("")}</div><div id=adminArea></div></div>`}
window.adminTable=async name=>{let a=$("#adminArea"),r=await db.from(name).select("*").order("created_at",{ascending:false}).limit(100);if(r.error){a.innerHTML=`<p class=err>${esc(r.error.message)}</p>`;return}let rows=r.data||[];a.innerHTML=`<h2>${esc(name)}</h2>${name==="exchange_rates"?`<div class=card><h3>Deji qiimaha iyo khidmada sarifka</h3><form id=rateForm><div class=formgrid>${sel("Lacagta laga dirayo","from_asset",["USDT","USD","EVC Plus","E-Dahab","ZAAD","SAHAL","Golis","SOMNET","WAAFI","Bank","BTC","ETH"])}${sel("Lacagta la helayo","to_asset",["USD","USDT","EVC Plus","E-Dahab","ZAAD","SAHAL","Golis","SOMNET","WAAFI","Bank","BTC","ETH"])}${field("Rate: 1 unit from = ? to","rate","number")}${field("Khidmad %","fee_percent","number")}${field("Khidmad go'an (to currency)","fixed_fee","number",false)}</div><label><input type=checkbox name=active checked style="width:auto"> Qiimahan ha shaqeeyo</label><button>Kaydi qiimaha</button></form></div>${table(rows)}<p class=muted>Marka aad qiime cusub kaydiso, xisaabiyaha macmiilka ayaa si toos ah u adeegsanaya qiimaha iyo khidmadaas.</p>`:name==="orders"?rows.map(o=>`<div class=card><b>Dalab ${esc(o.id)}</b><p>${esc(o.from_asset)} → ${esc(o.to_asset)} | ${esc(o.amount)} | ${esc(o.status)}</p><p>Sender: ${esc(o.sender_details||"")} · Recipient: ${esc(o.recipient||"")} · Network: ${esc(o.network||"")}</p><p>${esc(o.details||"")}</p>${o.proof_path?`<button class=secondary onclick="viewPrivateFile('order-proofs','${esc(o.proof_path)}')">Eeg caddeynta</button>`:""}<label>Admin note</label><input id="note_${esc(o.id)}" value="${esc(o.admin_note||"")}"><div class=actions><button class=green onclick="orderStatus('${esc(o.id)}','accepted')">Aqbal</button><button class=secondary onclick="orderStatus('${esc(o.id)}','processing')">Processing</button><button class=green onclick="orderStatus('${esc(o.id)}','completed')">Dhammaystir</button><button class=gray onclick="orderStatus('${esc(o.id)}','rejected')">Diid</button><button onclick="saveOrderNote('${esc(o.id)}')">Kaydi note</button></div></div>`).join(""):name==="identity_verifications"?rows.map(k=>`<div class=card><b>KYC ${esc(k.id)}</b> · User: ${esc(k.user_id)} · ${esc(k.status)}<p>${esc(k.admin_note||"")}</p>${k.photo_path?`<button class=secondary onclick="viewPrivateFile('identity-photos','${esc(k.photo_path)}')">Eeg sawirka KYC</button>`:""}<div class=actions><button class=green onclick="kycStatus('${esc(k.id)}','approved')">Ansixi</button><button class=gray onclick="kycStatus('${esc(k.id)}','rejected')">Diid</button></div></div>`).join(""):name==="support_messages"?rows.map(m=>`<div class=card><b>${esc(m.subject)}</b><p>User: ${esc(m.user_id)}</p><p>${esc(m.message)}</p><label>Jawaabta</label><textarea id="reply_${esc(m.id)}">${esc(m.admin_reply||"")}</textarea><button onclick="replySupport('${esc(m.id)}')">Dir jawaab</button></div>`).join(""):genericAdminEditor(name,rows)}<h3>Maamul xogta</h3><p class=muted>Waxaad ku dari kartaa xogta jadwallada kale adigoo buuxinaya fields-ka jira.</p>`}
document.addEventListener("submit",async e=>{if(e.target.id!=="rateForm")return;e.preventDefault();let f=new FormData(e.target),from=f.get("from_asset"),to=f.get("to_asset");if(from===to)return say("Lacagta laga dirayo iyo tan la helayo isku mid ma noqon karaan.","err");let row={from_asset:from,to_asset:to,rate:Number(f.get("rate")),fee_percent:Number(f.get("fee_percent")||0),fixed_fee:Number(f.get("fixed_fee")||0),active:f.get("active")==="on",updated_at:new Date().toISOString()};if(!(row.rate>0)||row.fee_percent<0||row.fixed_fee<0)return say("Rate iyo khidmadaha geli tiro sax ah.","err");let old=await db.from("exchange_rates").select("id").eq("from_asset",from).eq("to_asset",to).maybeSingle();let result=old.data?await db.from("exchange_rates").update(row).eq("id",old.data.id):await db.from("exchange_rates").insert(row);say(result.error?.message||"Qiimaha iyo khidmada waa la kaydiyey.","ok");adminTable("exchange_rates")});

function genericAdminEditor(name,rows){
 let cols=rows.length?Object.keys(rows[0]).filter(k=>!["id","created_at","updated_at"].includes(k)):["name","label","value","network","rate","fee_percent","fixed_fee","active"];
 return `<div class=card><h3>Ku dar xog cusub: ${esc(name)}</h3><form id=genericAdd data-table="${esc(name)}"><div class=formgrid>${cols.map(c=>`<div><label>${esc(c)}</label><input name="${esc(c)}" ${c==="active"?'placeholder="true / false"':""}></div>`).join("")}</div><button>Ku dar</button></form></div><div class=tablewrap><table><thead><tr><th>Record</th><th>Ficil</th></tr></thead><tbody>${rows.map(row=>`<tr><td><pre style="white-space:pre-wrap;max-width:650px">${esc(JSON.stringify(row,null,2))}</pre></td><td><button class=gray onclick="deleteAdminRow('${esc(name)}','${esc(row.id)}')">Tirtir</button></td></tr>`).join("")}</tbody></table></div>`;
}
document.addEventListener("submit",async e=>{
 if(e.target.id!=="genericAdd")return;
 e.preventDefault();let name=e.target.dataset.table,fd=new FormData(e.target),row={};
 for(let [k,v] of fd.entries()){if(v==="")continue;if(v==="true")row[k]=true;else if(v==="false")row[k]=false;else if(["rate","fee_percent","fixed_fee","amount","receive_amount","fee_amount"].includes(k))row[k]=Number(v);else row[k]=v}
 let r=await db.from(name).insert(row);say(r.error?.message||"Xogta waa lagu daray.","ok");adminTable(name)
});
window.deleteAdminRow=async(name,id)=>{if(!confirm("Ma hubtaa inaad tirtirayso record-kan?"))return;let r=await db.from(name).delete().eq("id",id);say(r.error?.message||"Waa la tirtiray.","ok");adminTable(name)};
window.viewPrivateFile=async(bucket,path)=>{let r=await db.storage.from(bucket).createSignedUrl(path,300);if(r.error)return say(r.error.message,"err");window.open(r.data.signedUrl,"_blank","noopener")};
window.orderStatus=async(id,status)=>{let note=$("#note_"+CSS.escape(id))?.value||"",r=await db.from("orders").update({status,admin_note:note}).eq("id",id);if(!r.error){let ord=await db.from("orders").select("user_id").eq("id",id).maybeSingle();if(ord.data?.user_id)await db.from("notifications").insert({user_id:ord.data.user_id,title:"Cusboonaysiinta dalabka",message:`Dalabkaaga xaaladdiisu waa ${status}.`})}say(r.error?.message||"Xaaladda dalabka waa la beddelay.","ok");adminTable("orders")};
window.saveOrderNote=async id=>{let r=await db.from("orders").update({admin_note:$("#note_"+CSS.escape(id)).value}).eq("id",id);say(r.error?.message||"Note waa la kaydiyey.","ok")};
window.kycStatus=async(id,status)=>{let note=prompt("Qoraal maamulka (ikhtiyaari)","");let r=await db.from("identity_verifications").update({status,admin_note:note}).eq("id",id);say(r.error?.message||"Xaaladda KYC waa la beddelay.","ok");adminTable("identity_verifications")};
window.replySupport=async id=>{let reply=$("#reply_"+CSS.escape(id)).value,r=await db.from("support_messages").update({admin_reply:reply,status:"answered"}).eq("id",id);if(!r.error){let msg=await db.from("support_messages").select("user_id").eq("id",id).maybeSingle();if(msg.data?.user_id)await db.from("notifications").insert({user_id:msg.data.user_id,title:"Jawaab Support",message:"Maamulka ayaa kaaga jawaabay fariintaada."})}say(r.error?.message||"Jawaabta waa la diray.","ok");adminTable("support_messages")};
(async()=>{await sync();db.auth.onAuthStateChange(async()=>sync());page("home")})();
</script></body></html>
